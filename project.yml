# Generate the Xcode project with:  brew install xcodegen && xcodegen
#
# The whole scene (moving body, sky, ink clock, Settings card) lives in one web page,
# preview/index.html. The apps show it full screen and add location, desktop mode and the rest.
name: NOW
options:
  bundleIdPrefix: com.annaunterholzner
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    PRODUCT_NAME: NOW
    PRODUCT_BUNDLE_IDENTIFIER: com.annaunterholzner.now

targets:
  NOW-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
        excludes: ["Fonts/**"]
      - path: preview/index.html
        buildPhase: resources
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: NOW
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        NSLocationWhenInUseUsageDescription: "NOW uses your approximate location so the sun, moon and seasons in the picture match your sky. It never leaves your device."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"

  NOW-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
        excludes: ["Fonts/**"]
      - path: macOS
      - path: preview/index.html
        buildPhase: resources
    info:
      path: Generated/macOS-Info.plist
      properties:
        CFBundleDisplayName: NOW
        LSApplicationCategoryType: public.app-category.lifestyle
        NSLocationUsageDescription: "NOW uses your approximate location so the sun, moon and seasons in the picture match your sky. It never leaves your device."
        NSLocationWhenInUseUsageDescription: "NOW uses your approximate location so the sun, moon and seasons in the picture match your sky. It never leaves your device."
    entitlements:
      path: Generated/NOW.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
