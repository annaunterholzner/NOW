# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: NOW
options:
  bundleIdPrefix: com.annaunterholzner
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: NOW
    PRODUCT_BUNDLE_IDENTIFIER: com.annaunterholzner.now

targets:
  NOW-iOS:
    type: application
    platform: iOS
    sources: [Shared]
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: NOW
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        NSLocationWhenInUseUsageDescription: "NOW uses your approximate location so the sun, moon and seasons in the picture match your sky."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"

  NOW-macOS:
    type: application
    platform: macOS
    sources: [Shared, macOS]
    info:
      path: Generated/macOS-Info.plist
      properties:
        CFBundleDisplayName: NOW
        LSApplicationCategoryType: public.app-category.lifestyle
        NSLocationUsageDescription: "NOW uses your approximate location so the sun, moon and seasons in the picture match your sky."
        NSLocationWhenInUseUsageDescription: "NOW uses your approximate location so the sun, moon and seasons in the picture match your sky."
    entitlements:
      path: Generated/NOW.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.location: true
