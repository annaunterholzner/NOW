name: Build

# Builds the iPhone and Mac apps on every push, so we know they compile.
# The Mac app is also published as a download: Releases › "NOW for Mac (latest build)".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen

      - name: Build the Mac app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project NOW.xcodeproj -target NOW-macOS -configuration Release \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO build 2>&1 | tee mac.log | grep -E "error|warning: |BUILD" || true
          grep -q "BUILD SUCCEEDED" mac.log

      - name: Build the iPhone app (simulator)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project NOW.xcodeproj -target NOW-iOS -configuration Debug \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios.log | grep -E "error|warning: |BUILD" || true
          grep -q "BUILD SUCCEEDED" ios.log

      - name: Report build problems
        if: failure()
        shell: bash
        run: |
          # Turn compiler errors into annotations, so they show up on the run's summary page.
          for f in mac ios; do
            [ -f "$f.log" ] || continue
            grep -E "(error|warning): " "$f.log" | grep -v "^ld: warning" | sort -u | head -n 40 | while IFS= read -r line; do
              level=warning; case "$line" in *"error: "*) level=error;; esac
              if [[ "$line" =~ ^(/[^:]+):([0-9]+):([0-9]+):\ (error|warning):\ (.*)$ ]]; then
                file="${BASH_REMATCH[1]#$GITHUB_WORKSPACE/}"
                echo "::$level file=$file,line=${BASH_REMATCH[2]},col=${BASH_REMATCH[3]},title=$f::${BASH_REMATCH[5]}"
              else
                echo "::$level title=$f::${line:0:400}"
              fi
            done
          done

      - name: Package the Mac app
        if: success()
        run: ditto -c -k --keepParent build/Release/NOW.app NOW-mac.zip

      - name: Publish the Mac download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete mac-latest --yes --cleanup-tag || true
          gh release create mac-latest NOW-mac.zip \
            --title "NOW for Mac (latest build)" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. Download NOW-mac.zip, unzip it, move NOW to Applications. The first time, macOS will block it: open System Settings › Privacy & Security, scroll down and click Open Anyway." \
            --latest
